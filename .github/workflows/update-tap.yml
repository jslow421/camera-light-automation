name: Update Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to the tap (e.g. v0.1.1)
        required: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Compute tarball sha256
        id: tarball
        run: |
          set -o pipefail
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: jslow421/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}

      - name: Update formula
        run: |
          sed -i -E \
            -e 's|^  url ".*"|  url "${{ steps.tarball.outputs.url }}"|' \
            -e 's|^  sha256 ".*"|  sha256 "${{ steps.tarball.outputs.sha }}"|' \
            Formula/litra-cam.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "litra-cam ${TAG}" || { echo "No changes"; exit 0; }
          git push
